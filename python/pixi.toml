# pixi workspace for building, installing and testing fortransitions.
#
#   pixi run install   build the Fortran shared library and install the
#                      package (editable) into the pixi environment
#   pixi run test      install, then run the tests
#   pixi run clean     remove all build products
#
# Add `-e ifx` to build with the Intel compiler (environment ifx), and
# `-e compare` for the comparison with cosmoTransitions (see below).
#
# All build logic lives in the Makefile; the tasks only call it, so the
# pixi build and the manual build (`make wrapper`) cannot diverge.

[workspace]
name = "fortransitions"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
pip = "*"
setuptools = ">=77"
wheel = "*"
fpm = ">=0.14"
gfortran = "*"
make = "*"
git = "*"

[tasks]
install = 'make wrapper PC=python PIP_FLAGS="--no-deps --no-build-isolation"'
test = { cmd = "python test/run_tests.py", depends-on = ["install"] }
clean = "make clean PC=python"

# Environment for comparing against the original Python package:
#   pixi run -e compare compare
# Python, numpy and scipy are pinned to the versions with which the
# reference values in ../reference were produced.
[feature.compare.dependencies]
python = "3.13.*"
numpy = "2.2.*"
scipy = "1.16.*"

[feature.compare.pypi-dependencies]
cosmoTransitions = "*"

[feature.compare.tasks]
compare = { cmd = "python test/compare_cosmoTransitions.py", depends-on = ["install"] }

# Environment with the Intel compiler ifx instead of gfortran:
#   pixi run -e ifx install
#   pixi run -e ifx test
# The package sets FC=ifx on activation, which the Makefile picks up. The
# library then links Intel's runtime libraries from this environment.
[feature.ifx.dependencies]
ifx_linux-64 = "*"

[environments]
compare = ["compare"]
ifx = ["ifx"]
# The comparison with cosmoTransitions using the ifx build:
#   pixi run -e compare-ifx compare
compare-ifx = ["compare", "ifx"]
