[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortransitions"
version = "0.1.0"
description = "Python interface to fortransitions, a Fortran port of CosmoTransitions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Thomas Biekötter", email = "thomas.biekoetter@desy.de" }
]
dependencies = ["numpy"]

[project.optional-dependencies]
compare = ["cosmoTransitions", "scipy"]

[tool.setuptools]
# lib/ holds the Fortran shared libraries (built by `make lib`); it is
# declared as a package so that setuptools ships its .so files as data.
packages = ["fortransitions", "fortransitions.lib"]
include-package-data = true

[tool.setuptools.package-data]
"fortransitions.lib" = ["*.so"]
